name: Update FPL data

on:
  schedule:
    - cron: '17 * * * *'   # every hour at :17
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull latest FPL data
        run: node scripts/fetch-fpl.mjs
      - name: Save changes
        run: |
          git config user.name "eplfanatic-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fpl.json
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Update FPL data"
            git push
          fi
